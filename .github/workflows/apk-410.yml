# Compila os APKs do AA410 e do Zap410 (área 410) e publica em
# https://github.com/gilsonbolivar-maker/Zap.das.Areas/releases/download/410-apk/aa410.apk
# https://github.com/gilsonbolivar-maker/Zap.das.Areas/releases/download/410-apk/zap410.apk
# Os APKs abrem a página do site; só precisa recompilar quando o código Android muda.
name: APKs do AA410 e do Zap410

on:
  push:
    branches: [main]
    paths:
      - '410/painel/android/**'
      - '.github/workflows/apk-410.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-410
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # A chave de assinatura vem dos segredos do repositório (Settings → Secrets and
      # variables → Actions), nunca do código: o repositório é público.
      - name: Montar a chave de assinatura
        id: chave
        env:
          SINAL_ASSINATURA: ${{ secrets.SINAL_ASSINATURA }}
          SINAL_SENHA: ${{ secrets.SINAL_SENHA }}
        run: |
          if [ -z "$SINAL_ASSINATURA" ] || [ -z "$SINAL_SENHA" ]; then
            echo "tem=nao" >> "$GITHUB_OUTPUT"
          else
            echo "$SINAL_ASSINATURA" | base64 -d > "$RUNNER_TEMP/assinatura.jks"
            echo "tem=sim" >> "$GITHUB_OUTPUT"
          fi

      # Sem os segredos, compila a versão de teste (assinada com uma chave provisória)
      # e publica assim mesmo, para já dar para instalar. Atenção: cada compilação
      # de teste tem uma chave diferente, então para atualizar é preciso desinstalar
      # antes. Com os segredos SINAL_ASSINATURA e SINAL_SENHA, sai a versão definitiva.
      - name: Compilar versão de teste (sem a chave)
        if: steps.chave.outputs.tem == 'nao'
        working-directory: 410/painel/android
        run: |
          gradle --no-daemon assembleSinalDebug assemblePainelDebug
          mkdir -p app/build/outputs/apk/sinal/release app/build/outputs/apk/painel/release
          cp app/build/outputs/apk/sinal/debug/app-sinal-debug.apk app/build/outputs/apk/sinal/release/app-sinal-release.apk
          cp app/build/outputs/apk/painel/debug/app-painel-debug.apk app/build/outputs/apk/painel/release/app-painel-release.apk
          echo "::warning::Publicado como versão de teste: faltam os segredos SINAL_ASSINATURA e SINAL_SENHA."

      - name: Compilar
        if: steps.chave.outputs.tem == 'sim'
        working-directory: 410/painel/android
        env:
          SINAL_ASSINATURA_ARQUIVO: ${{ runner.temp }}/assinatura.jks
          SINAL_SENHA: ${{ secrets.SINAL_SENHA }}
        run: gradle --no-daemon assembleSinalRelease assemblePainelRelease

      - name: Apagar a chave
        if: always()
        run: rm -f "$RUNNER_TEMP/assinatura.jks"

      - name: Publicar os APKs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp 410/painel/android/app/build/outputs/apk/sinal/release/app-sinal-release.apk aa410.apk
          cp 410/painel/android/app/build/outputs/apk/painel/release/app-painel-release.apk zap410.apk
          gh release delete 410-apk --yes --cleanup-tag || true
          gh release create 410-apk aa410.apk zap410.apk \
            --title "AA410 e Zap410 para Android" \
            --notes "APKs do AA410 e do Zap410 (área 410): escutam com a tela apagada e tocam o alarme do aparelho. Compilado de ${GITHUB_SHA::7}." \
            --target "$GITHUB_SHA"
